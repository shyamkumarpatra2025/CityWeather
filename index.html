<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Metadata for the browser -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Weather App</title>
    
    <!-- Link to our separate CSS file to make it look nice -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- A container to hold our app together in the middle of the screen -->
    <div class="app-container">
        <h1>Weather App 🌤️</h1>
        
        <!-- Input field where the user will type the city name -->
        <input type="text" id="cityInput" placeholder="Enter a city (e.g., London)">
        
        <!-- Button to trigger the weather search -->
        <button id="searchBtn">Get Weather</button>
        
        <!-- This empty div is where we will display the result using JavaScript -->
        <div id="weatherResult">
            <!-- Results will appear here -->
        </div>
    </div>

    <!-- Link to our separate JavaScript file to make it interactive -->
    <script src="script.js"></script>
</body>
</html>
